name: CI

on:
  push:
    branches: [master, feat/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r backend/requirements-mcp.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: MCP server wiring smoke
        run: python -c "import backend.mcp_server as s; import asyncio; ts = asyncio.run(s.mcp.list_tools()); print(len(ts if isinstance(ts, list) else ts.tools), 'MCP tools registered')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (must be error-free)
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
