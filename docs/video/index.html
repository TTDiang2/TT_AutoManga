<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>TT_AutoManga showcase</title>
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
/* TT_AutoManga showcase film — the picture is a function of time.
   Deterministic: window.render(t) draws the frame at time t (seconds).
   Pipeline (see build.mjs): headless Chrome screenshots render(t) frame by
   frame, then ffmpeg muxes. Technique after lemo-opuscar/TECHNIQUE.md. */

window.DUR = 78.0;

const IMG = {};
const SOURCES = {
  cover:   "assets/pages/p0.jpg",
  p1: "assets/pages/p1.jpg", p2: "assets/pages/p2.jpg", p3: "assets/pages/p3.jpg",
  p4: "assets/pages/p4.jpg", p5: "assets/pages/p5.jpg", p6: "assets/pages/p6.jpg",
  p7: "assets/pages/p7.jpg",
  uiStory:  "assets/ui/04-storyboard.jpg",
  uiShow:   "assets/ui/01-showcase.jpg",
  uiComp:   "assets/ui/02-composer-trapezoid.jpg",
  uiCompG:  "assets/ui/03-composer-grid.jpg",
  uiPrompt: "assets/ui/06-promptlab.jpg",
  uiAssets: "assets/ui/07-assets.jpg",
};
for (let i = 1; i <= 20; i++) SOURCES["panel" + i] = "assets/panels/p" + (i < 10 ? "0" + i : i) + ".jpg";

let loaded = 0, total = Object.keys(SOURCES).length;
for (const [k, src] of Object.entries(SOURCES)) {
  const im = new Image();
  im.onload = () => { loaded++; };
  im.src = src;
  IMG[k] = im;
}
window.READY = () => loaded >= total;

/* ---------- deterministic helpers ---------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = 1920, H = 1080;
const PAPER = "#f4efe3", INK = "#1c1a17", RED = "#b3342e", FAINT = "#8a8378";

const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const ease = x => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;      // inOutCubic
const easeOut = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;

function paper(t) {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  // subtle vignette
  const g = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.95);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(60,50,30,0.14)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function txt(s, x, y, size, color, weight, align, alpha, spacing) {
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color || INK;
  ctx.font = `${weight || 400} ${size}px "Microsoft YaHei", sans-serif`;
  ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  if (spacing) {                       // manual letter-spacing
    const chars = [...s];
    const widths = chars.map(c => ctx.measureText(c).width + spacing);
    const totalW = widths.reduce((a, b) => a + b, 0) - spacing;
    let cx = align === "center" ? x - totalW / 2 : (align === "right" ? x - totalW : x);
    ctx.textAlign = "left";
    chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += widths[i]; });
  } else ctx.fillText(s, x, y);
  ctx.restore();
}
// ken burns: draw img covering a target rect with a slow zoom/pan
function kenBurns(img, rx, ry, rw, rh, z0, z1, p, px0, py0, px1, py1) {
  const z = lerp(z0, z1, ease(p));
  const ox = lerp(px0 || 0, px1 || 0, ease(p)), oy = lerp(py0 || 0, py1 || 0, ease(p));
  const cw = rw * z, ch = rh * z;
  const cx = rx + rw/2 - cw/2 + ox * rw, cy = ry + rh/2 - ch/2 + oy * rh;
  // cover-fit the source inside (cw, ch)
  const ia = img.width / img.height, ra = cw / ch;
  let sw, sh, sx, sy;
  if (ia > ra) { sh = img.height; sw = sh * ra; sx = (img.width - sw)/2; sy = 0; }
  else { sw = img.width; sh = sw / ra; sx = 0; sy = (img.height - sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, cx, cy, cw, ch);
}
function framed(img, rx, ry, rw, rh, p, z0, z1, px0, py0, px1, py1, border) {
  if (p <= 0) return;
  ctx.save();
  ctx.shadowColor = "rgba(30,25,15,0.35)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = "#fff"; ctx.fillRect(rx, ry, rw, rh);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip();
  kenBurns(img, rx, ry, rw, rh, z0 || 1.0, z1 || 1.08, p, px0, py0, px1, py1);
  ctx.restore();
  if (border !== false) {
    ctx.strokeStyle = "rgba(28,26,23,0.9)"; ctx.lineWidth = 3;
    ctx.strokeRect(rx, ry, rw, rh);
  }
}
function pop(p) { // overshooting scale for "pop-in"
  if (p >= 1) return 1;
  const x = easeOut(p);
  return 1 + 0.18 * Math.sin(Math.min(1, p) * Math.PI) * (1 - x) + x * 0;
}
function callout(x, y, lines, p, opts) {
  // opts: { width, alignRight, fontSize, lineHeight }
  opts = opts || {};
  if (p <= 0) return;
  const fs = opts.fontSize || 34;
  const lh = fs * (opts.lineHeight || 1.5);
  const a = ease(seg(p, 0, 0.6));
  const slide = (1 - a) * (opts.alignRight ? 40 : -40);
  const pad = 26;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `400 ${fs}px "Microsoft YaHei", sans-serif`;
  const w = opts.width || Math.max(...lines.map(s => ctx.measureText(s).width)) + pad * 2;
  const h = lines.length * lh + 26;
  ctx.translate(x + slide, y);
  ctx.fillStyle = "rgba(28,26,23,0.86)";
  const bx = opts.alignRight ? -w : 0;
  ctx.beginPath(); ctx.roundRect(bx, -16, w, h, 10); ctx.fill();
  ctx.fillStyle = RED; ctx.fillRect(bx, -16, 6, h);
  ctx.fillStyle = "#f4efe3";
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  lines.forEach((s, i) => ctx.fillText(s, bx + pad, -16 + 13 + (i + 0.5) * lh));
  ctx.restore();
}

/* ---------- timeline scenes ---------- */
window.render = function (t) {
  paper(t);
  if (t < 7) return sceneHook(t);
  if (t < 17) return scenePipeline(t - 7);
  if (t < 27) return sceneStoryboard(t - 17);
  if (t < 39) return sceneGenerate(t - 27);
  if (t < 53) return sceneLettering(t - 39);
  if (t < 63) return sceneUI(t - 53);
  if (t < 71) return sceneExport(t - 63);
  return sceneEnd(t - 71);
};

/* S0 — hook: an idea types itself, then the title stamp */
function sceneHook(t) {
  // ink enso draws behind the text
  const p = ease(seg(t, 0.3, 2.2));
  ctx.save();
  ctx.strokeStyle = INK; ctx.lineWidth = 10; ctx.lineCap = "round";
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.arc(W/2, H/2 - 40, 330, -Math.PI/2, -Math.PI/2 + p * Math.PI * 1.92);
  ctx.stroke(); ctx.restore();

  const line = "给「魏征斩龙王」画一部水墨漫画";
  const n = Math.floor(ease(seg(t, 1.0, 3.2)) * line.length);
  txt(line.slice(0, n) + (seg(t, 1.0, 3.2) < 1 && Math.floor(t*3)%2 ? "|" : ""),
      W/2, H/2 - 40, 64, INK, 600, "center");

  const tp = ease(seg(t, 4.0, 5.0));
  if (tp > 0) {
    ctx.save(); ctx.globalAlpha = tp;
    ctx.translate(W/2, H/2 - 40); ctx.rotate(-0.03); ctx.scale(0.6 + 0.4*tp, 0.6 + 0.4*tp);
    ctx.fillStyle = RED; ctx.beginPath(); ctx.roundRect(-420, -88, 840, 176, 14); ctx.fill();
    txt("TT_AutoManga", 0, 0, 92, "#f4efe3", 800, "center", 1, 2);
    ctx.restore();
    const sp = ease(seg(t, 5.2, 5.8));
    txt("从一个想法，到一部漫画", W/2, H/2 + 180, 46, INK, 500, "center", sp, 6);
    txt("idea → storyboard → art → pages → PDF", W/2, H/2 + 250, 26, FAINT, 400, "center", sp, 2);
  }
}

/* S1 — the pipeline in one line */
function scenePipeline(t) {
  txt("全流程，一条指令", W/2, 120, 54, INK, 700, "center", ease(seg(t, 0, 0.5)), 8);
  const steps = [
    ["构思", "idea"], ["分镜", "storyboard"], ["生成", "SwarmUI"], ["排版", "composer"], ["导出", "PDF/ZIP"],
  ];
  const bw = 280, gap = 60, x0 = W/2 - (5*bw + 4*gap)/2, y0 = H/2 - 60;
  steps.forEach(([name, en], i) => {
    const p = ease(seg(t, 0.4 + i*0.75, 1.15 + i*0.75));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = p;
    const y = y0 + (1 - p) * 60;
    ctx.fillStyle = "rgba(28,26,23,0.06)";
    ctx.beginPath(); ctx.roundRect(x0 + i*(bw+gap), y, bw, 300, 16); ctx.fill();
    ctx.strokeStyle = "rgba(28,26,23,0.75)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(x0 + i*(bw+gap), y, bw, 300, 16); ctx.stroke();
    txt(String(i+1), x0 + i*(bw+gap) + 34, y + 48, 30, RED, 800, "center");
    txt(name, x0 + i*(bw+gap) + bw/2, y + 130, 46, INK, 700, "center", 1, 4);
    txt(en, x0 + i*(bw+gap) + bw/2, y + 200, 24, FAINT, 400, "center");
    ctx.restore();
    if (i < 4) {
      const ap = ease(seg(t, 0.9 + i*0.75, 1.5 + i*0.75));
      if (ap > 0) {
        ctx.save(); ctx.globalAlpha = ap; ctx.strokeStyle = RED; ctx.lineWidth = 5;
        const ax = x0 + i*(bw+gap) + bw + 8, ay = y0 + 150;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + gap - 22, ay); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ax + gap - 22, ay); ctx.lineTo(ax + gap - 40, ay - 12);
        ctx.moveTo(ax + gap - 22, ay); ctx.lineTo(ax + gap - 40, ay + 12); ctx.stroke();
        ctx.restore();
      }
    }
  });
  const cp = ease(seg(t, 4.4, 5.2));
  txt("每一步都可以由 Agent 驱动 —— 28 个 MCP 工具 · REST · CLI · Agent Skill",
      W/2, H - 130, 30, FAINT, 400, "center", cp);
}

/* S2 — storyboard */
function sceneStoryboard(t) {
  framed(IMG.uiStory, 120, 100, 1160, 653, ease(seg(t, 0, 0.8)), 1.0, 1.07, 0, -0.02, 0.02, 0);
  callout(1310, 180, ["把一段故事拆成", "20 格分镜"], ease(seg(t, 0.9, 1.5)), {alignRight: true, fontSize: 36, width: 470});
  callout(1310, 400, ["每格带 角色 · 场景 ·", "景别 · 台词"], ease(seg(t, 1.7, 2.3)), {alignRight: true, fontSize: 36, width: 470});
  callout(1310, 620, ["台词「名字：内容」", "自动识别说话人"], ease(seg(t, 2.5, 3.1)), {alignRight: true, fontSize: 36, width: 470});
  const sp = ease(seg(t, 4.6, 5.4));
  txt("角色块 · 场景库 · 故事圣经 跨章保存", W/2, H - 90, 30, FAINT, 400, "center", sp);
}

/* S3 — generation + consistency */
function sceneGenerate(t) {
  txt("本地批量出图", W/2, 96, 50, INK, 700, "center", ease(seg(t, 0, 0.4)), 8);
  txt("SwarmUI · qwen-image / SDXL · 逐图嵌入生成配方，任何工具可复现",
      W/2, 168, 28, FAINT, 400, "center", ease(seg(t, 0.3, 0.8)));
  const ids = [1, 2, 4, 5, 6, 7, 8, 9, 10, 12, 16, 17];
  const cw = 300, ch = 420, gx = 26, gy = 26;
  const x0 = W/2 - (4*cw + 3*gx)/2, y0 = 230;
  ids.forEach((pid, i) => {
    const p = ease(seg(t, 0.6 + i*0.16, 1.15 + i*0.16));
    if (p <= 0) return;
    const col = i % 4, row = Math.floor(i / 4);
    const x = x0 + col*(cw+gx), y = y0 + row*(ch+gy);
    ctx.save(); ctx.globalAlpha = p;
    const s = 0.85 + 0.15 * pop(p);
    ctx.translate(x + cw/2, y + ch/2); ctx.scale(s, s); ctx.translate(-(x + cw/2), -(y + ch/2));
    framed(IMG["panel" + pid], x, y, cw, ch, 1, 1, 1, 0, 0, 0, 0, false);
    ctx.restore();
  });
  // consistency strip slides up over the grid bottom
  const cp = ease(seg(t, 3.4, 4.2));
  if (cp > 0) {
    ctx.save(); ctx.globalAlpha = cp;
    ctx.fillStyle = "rgba(244,239,227,0.96)";
    ctx.fillRect(0, H - 250, W, 250);
    ctx.restore();
    txt("角色一致性：刚性提示块 · 一格一实例 · 图生图链",
        W/2, H - 205, 34, INK, 600, "center", cp);
    const faces = ["panel12", "panel13", "panel14", "panel17"];
    const fw = 210, fh = 150, fx0 = W/2 - (4*fw + 3*24)/2;
    faces.forEach((k, i) => {
      const p = ease(seg(t, 4.0 + i*0.25, 4.6 + i*0.25));
      if (p <= 0) return;
      ctx.save(); ctx.globalAlpha = p;
      ctx.beginPath(); ctx.rect(fx0 + i*(fw+24), H - 160, fw, fh); ctx.clip();
      kenBurns(IMG[k], fx0 + i*(fw+24), H - 160, fw, fh, 1.6, 1.75, 1, 0, 0.1, 0, 0.1);
      ctx.restore();
      ctx.strokeStyle = "rgba(28,26,23,0.7)"; ctx.lineWidth = 2;
      ctx.strokeRect(fx0 + i*(fw+24), H - 160, fw, fh);
    });
  }
}

/* S4 — assembly & lettering details */
function sceneLettering(t) {
  framed(IMG.p5, 130, 80, 620, 930, ease(seg(t, 0, 0.8)), 1.0, 1.12, 0, -0.03, 0, 0.02);
  callout(790, 170, ["模板自动排版", "23+ 模板 · 斜框 · 条漫"], ease(seg(t, 0.7, 1.3)), {fontSize: 30});
  callout(790, 350, ["自动气泡 · 竖排紧排", "每列 ≥5 字 · ︐ ︕ ︒"], ease(seg(t, 1.5, 2.1)), {fontSize: 30});
  callout(790, 530, ["气泡永不遮脸", "SFX 描边字 · 旁白框 · 页码"], ease(seg(t, 2.3, 2.9)), {fontSize: 30});

  // trapezoid page showcase slides in from the right
  const tp = ease(seg(t, 3.4, 4.4));
  if (tp > 0) {
    ctx.save(); ctx.globalAlpha = tp;
    ctx.translate(lerp(2100, 1330, tp), 0);
    framed(IMG.p6, 0, 70, 470, 830, 1, 1.0, 1.1, 0, -0.02, 0, 0.02);
    txt("梯形框 = 画面自身的透视", 235, 950, 28, INK, 500, "center", tp);
    ctx.restore();
  }
}

/* S5 — real UI */
function sceneUI(t) {
  const shots = [
    [IMG.uiComp,  "可视化排字器", "拖一条线，切开分镜框"],
    [IMG.uiCompG, "所见即所得", "模板 · 气泡 · SFX · 撤销重做"],
    [IMG.uiAssets, "逐格素材管理", "重生成 · 变体 · 透明背景"],
  ];
  const i = Math.min(shots.length - 1, Math.floor(t / 3.33));
  const [img, title, sub] = shots[i];
  const lt = t - i * 3.33;
  framed(img, 130, 80, 1220, 686, ease(seg(lt, 0, 0.6)), 1.0, 1.05, 0, 0, 0, 0);
  const p = ease(seg(lt, 0.5, 1.0));
  txt(title, 1390, 300, 44, INK, 700, "left", p);
  txt(sub, 1390, 380, 30, FAINT, 400, "left", p);
  // progress dots
  shots.forEach((_, d) => {
    ctx.fillStyle = d === i ? RED : "rgba(28,26,23,0.2)";
    ctx.beginPath(); ctx.arc(1390 + d * 36, 480, 7, 0, Math.PI*2); ctx.fill();
  });
  const cp = ease(seg(t, 8.6, 9.2));
  txt("人的手感，Agent 的效率 —— 两者共用同一份工程数据", W/2, H - 80, 32, INK, 500, "center", cp);
}

/* S6 — export fan */
function sceneExport(t) {
  txt("一键成书", W/2, 110, 52, INK, 700, "center", ease(seg(t, 0, 0.5)), 8);
  const ids = ["cover", "p1", "p2", "p3", "p4", "p5", "p6", "p7"];
  const pw = 300, ph = 450, cx = W/2, cy = H/2 + 30;
  ids.forEach((k, i) => {
    const p = ease(seg(t, 0.4 + i*0.22, 1.0 + i*0.22));
    if (p <= 0) return;
    const mid = (ids.length - 1) / 2, off = i - mid;
    ctx.save(); ctx.globalAlpha = p;
    ctx.translate(cx + off * 92, cy + Math.abs(off) * 26);
    ctx.rotate(off * 0.055);
    ctx.scale(0.9 + 0.1 * Math.cos(off), 0.9 + 0.1 * Math.cos(off));
    ctx.shadowColor = "rgba(30,25,15,0.4)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 12;
    ctx.fillStyle = "#fff"; ctx.fillRect(-pw/2, -ph/2, pw, ph);
    ctx.shadowColor = "transparent";
    ctx.save(); ctx.beginPath(); ctx.rect(-pw/2, -ph/2, pw, ph); ctx.clip();
    kenBurns(IMG[k], -pw/2, -ph/2, pw, ph, 1.0, 1.0, 1);
    ctx.restore();
    ctx.strokeStyle = "rgba(28,26,23,0.85)"; ctx.lineWidth = 2.5;
    ctx.strokeRect(-pw/2, -ph/2, pw, ph);
    ctx.restore();
  });
  const p1 = ease(seg(t, 2.6, 3.2));
  txt("PDF · ZIP · 最高 4800×7200 · 自动页码", W/2, H - 130, 34, INK, 500, "center", p1);
  const p2 = ease(seg(t, 3.2, 3.8));
  txt("本地 Real-ESRGAN 一键放大 print 级原画", W/2, H - 70, 28, FAINT, 400, "center", p2);
}

/* S7 — end card */
function sceneEnd(t) {
  const p = ease(seg(t, 0, 0.8));
  ctx.save(); ctx.globalAlpha = p;
  ctx.translate(W/2, H/2 - 120);
  ctx.rotate(-0.02);
  ctx.fillStyle = RED; ctx.beginPath(); ctx.roundRect(-430, -90, 860, 180, 14); ctx.fill();
  txt("TT_AutoManga", 0, 0, 90, "#f4efe3", 800, "center", 1, 2);
  ctx.restore();
  const p2 = ease(seg(t, 0.8, 1.5));
  txt("从一个想法，到一部漫画。", W/2, H/2 + 110, 48, INK, 600, "center", p2, 6);
  const p3 = ease(seg(t, 1.6, 2.3));
  txt("github.com/TTDiang2/TT_AutoManga", W/2, H/2 + 230, 30, FAINT, 500, "center", p3, 1);
  txt("FastAPI · React · SwarmUI · MCP · MIT", W/2, H/2 + 300, 24, FAINT, 400, "center", p3);
}
</script>
</body>
</html>
